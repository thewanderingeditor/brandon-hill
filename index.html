<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Park Test</title>
<meta name="description" content="Monthly two-person fitness test scorecard.">
<meta name="theme-color" content="#14171A">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black">
<meta name="apple-mobile-web-app-title" content="Park Test">
<meta name="robots" content="noindex, nofollow">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="manifest" href="manifest.webmanifest">
<style>
@import url('https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;600;700&family=IBM+Plex+Mono:wght@400;600&display=swap');

html, body { margin: 0; padding: 0; background: #E6E7E2; }
.pt * { box-sizing: border-box; }
.pt {
  --concrete: #E6E7E2;
  --sand: #F3F3EF;
  --card: #FFFFFF;
  --line: #C9CCC4;
  --ink: #14171A;
  --muted: #6C7269;
  --blue: #1F3BC4;
  --ochre: #D99B15;
  --display: 'Barlow Condensed', 'Arial Narrow', system-ui, sans-serif;
  --mono: 'IBM Plex Mono', ui-monospace, 'SF Mono', monospace;
  background: var(--concrete);
  color: var(--ink);
  font-family: system-ui, -apple-system, 'Segoe UI', sans-serif;
  min-height: 100vh;
  padding-bottom: 88px;
  -webkit-font-smoothing: antialiased;
}
.pt button { font-family: inherit; cursor: pointer; border: none; background: none; color: inherit; }
.pt button:focus-visible, .pt input:focus-visible, .pt select:focus-visible {
  outline: 3px solid var(--blue); outline-offset: 2px;
}
.pt input, .pt select {
  font-family: var(--mono); font-size: 16px; color: var(--ink);
  background: var(--sand); border: 1px solid var(--line); border-radius: 2px;
  padding: 8px 10px; width: 100%;
}

.board { background: var(--ink); color: var(--concrete); padding: 14px 16px 12px; position: sticky; top: 0; z-index: 20; }
.board-top { display: flex; justify-content: space-between; align-items: baseline; margin-bottom: 12px; gap: 10px; }
.wordmark { font-family: var(--display); font-weight: 700; font-size: 26px; letter-spacing: 0.06em; text-transform: uppercase; line-height: 1; }
.board-date { font-family: var(--mono); font-size: 11px; letter-spacing: 0.08em; text-transform: uppercase; opacity: 0.65; text-align: right; }
.tally { display: grid; grid-template-columns: 1fr auto 1fr; align-items: center; gap: 10px; }
.tally-side { display: flex; flex-direction: column; gap: 2px; min-width: 0; }
.tally-side.right { align-items: flex-end; text-align: right; }
.tally-name { font-family: var(--display); text-transform: uppercase; letter-spacing: 0.08em; font-size: 15px; font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; max-width: 100%; }
.tally-num { font-family: var(--mono); font-weight: 600; font-size: 38px; line-height: 1; }
.tally-sub { font-family: var(--mono); font-size: 10px; opacity: 0.6; letter-spacing: 0.08em; }
.tally-vs { font-family: var(--display); font-size: 13px; letter-spacing: 0.12em; opacity: 0.5; }
.dot { width: 8px; height: 8px; border-radius: 50%; display: inline-block; margin-right: 6px; vertical-align: middle; }

.wrap { padding: 16px; max-width: 640px; margin: 0 auto; }
.eyebrow { font-family: var(--mono); font-size: 10px; letter-spacing: 0.18em; text-transform: uppercase; color: var(--muted); margin: 24px 0 8px; }
.eyebrow:first-child { margin-top: 4px; }
.card { background: var(--card); border: 1px solid var(--line); border-radius: 3px; margin-bottom: 10px; }
.note { background: var(--sand); border-left: 3px solid var(--ink); padding: 12px 14px; font-size: 13.5px; line-height: 1.5; margin-bottom: 16px; }
.note b { font-weight: 600; }

.item-head { display: flex; align-items: baseline; gap: 10px; padding: 12px 14px 10px; border-bottom: 1px solid var(--line); }
.item-num { font-family: var(--mono); font-size: 11px; color: var(--muted); }
.item-name { font-family: var(--display); font-size: 21px; font-weight: 600; text-transform: uppercase; letter-spacing: 0.03em; line-height: 1; flex: 1; }
.item-cap { font-family: var(--mono); font-size: 11px; color: var(--muted); white-space: nowrap; }
.lane { padding: 10px 14px; display: flex; align-items: center; gap: 12px; }
.lane + .lane { border-top: 1px dashed var(--line); }
.lane-name { font-family: var(--display); text-transform: uppercase; letter-spacing: 0.06em; font-size: 14px; font-weight: 600; width: 74px; flex-shrink: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.lane-body { flex: 1; min-width: 0; }
.readout { font-family: var(--mono); font-weight: 600; font-size: 28px; line-height: 1; letter-spacing: -0.02em; }
.readout small { font-size: 12px; font-weight: 400; color: var(--muted); margin-left: 4px; letter-spacing: 0; }
.bar { height: 6px; background: var(--sand); border: 1px solid var(--line); margin-top: 7px; position: relative; overflow: hidden; }
.bar-fill { height: 100%; transition: width 0.25s linear; }
.capped-flag { font-family: var(--mono); font-size: 10px; letter-spacing: 0.08em; text-transform: uppercase; background: var(--ink); color: var(--concrete); padding: 3px 6px; display: inline-block; margin-top: 7px; }
.ctrl { display: flex; gap: 6px; flex-shrink: 0; }
.btn { font-family: var(--display); text-transform: uppercase; letter-spacing: 0.08em; font-weight: 600; font-size: 14px; padding: 10px 14px; border: 1.5px solid var(--ink); border-radius: 2px; background: var(--card); min-width: 46px; }
.btn:active { transform: translateY(1px); }
.btn-solid { background: var(--ink); color: var(--concrete); }
.btn-wide { width: 100%; padding: 15px; font-size: 17px; }
.btn:disabled { opacity: 0.35; cursor: not-allowed; }
.btn-sm { font-size: 12px; padding: 6px 9px; min-width: 0; border-width: 1px; }
.stepper { font-family: var(--mono); font-size: 20px; font-weight: 600; width: 44px; height: 44px; border: 1.5px solid var(--ink); border-radius: 2px; background: var(--card); }

.rest { position: fixed; left: 0; right: 0; bottom: 68px; background: var(--ochre); color: var(--ink); padding: 10px 16px; display: flex; justify-content: space-between; align-items: center; z-index: 25; }
.rest-num { font-family: var(--mono); font-weight: 600; font-size: 20px; }
.rest-label { font-family: var(--display); text-transform: uppercase; letter-spacing: 0.1em; font-size: 14px; font-weight: 600; }

.row { display: flex; align-items: center; gap: 10px; padding: 10px 14px; border-bottom: 1px solid var(--line); }
.row:last-child { border-bottom: none; }
.row-label { flex: 1; font-size: 14px; min-width: 0; }
.val { font-family: var(--mono); font-size: 15px; font-weight: 600; width: 62px; text-align: right; }
.delta { font-family: var(--mono); font-size: 11px; width: 44px; text-align: right; color: var(--muted); }

.nav { position: fixed; bottom: 0; left: 0; right: 0; display: flex; background: var(--ink); z-index: 30; padding-bottom: env(safe-area-inset-bottom); }
.nav button { flex: 1; padding: 16px 4px 18px; font-family: var(--display); text-transform: uppercase; letter-spacing: 0.12em; font-size: 14px; font-weight: 600; color: rgba(230,231,226,0.5); border-top: 3px solid transparent; }
.nav button.on { color: var(--concrete); border-top-color: var(--ochre); }

.mini { font-size: 12px; color: var(--muted); line-height: 1.45; }
.grid2 { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
.setup-row { display: grid; grid-template-columns: 1fr 64px 62px auto; gap: 6px; align-items: center; padding: 8px 10px; border-bottom: 1px solid var(--line); }
.setup-row input, .setup-row select { padding: 7px 8px; font-size: 14px; }
.icon-btn { font-family: var(--mono); font-size: 15px; width: 30px; height: 34px; border: 1px solid var(--line); border-radius: 2px; background: var(--sand); }

.lock { background: var(--ink); color: var(--concrete); min-height: 100vh; display: flex; flex-direction: column; align-items: center; justify-content: center; padding: 24px; }
.lock .mini { color: rgba(230,231,226,0.75); }
.lock-hint { font-family: var(--display); text-transform: uppercase; letter-spacing: 0.14em; font-size: 13px; opacity: 0.55; margin: 16px 0 0; text-align: center; }
.pips { display: flex; gap: 15px; margin: 22px 0 32px; }
.pip { width: 13px; height: 13px; border-radius: 50%; border: 1.5px solid var(--concrete); opacity: 0.55; }
.pip.on { background: var(--ochre); border-color: var(--ochre); opacity: 1; }
.keypad { display: grid; grid-template-columns: repeat(3, 76px); gap: 12px; }
.key { height: 64px; border: 1px solid rgba(230,231,226,0.28); border-radius: 2px; font-family: var(--mono); font-size: 23px; color: var(--concrete); background: transparent; }
.key:active { background: rgba(230,231,226,0.16); }
.key.blank { border-color: transparent; }
.shake { animation: shake 0.4s; }
@keyframes shake {
  0%, 100% { transform: translateX(0); }
  20% { transform: translateX(-9px); }
  40% { transform: translateX(9px); }
  60% { transform: translateX(-5px); }
  80% { transform: translateX(5px); }
}

@media (prefers-reduced-motion: reduce) { .pt * { transition: none !important; animation: none !important; } }

.shot { width: 100%; display: block; border-bottom: 1px solid var(--line); background: var(--sand); }

</style>
</head>
<body>
<div id="root"></div>
