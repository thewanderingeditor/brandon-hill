# Free Supabase projects pause after seven days with no requests, and a monthly
# test would trip that every time. This pings a do-nothing function each Monday.
#
# Put this file at .github/workflows/keepalive.yml in your repo, and fill in the
# two values below with the same ones from config.js.
#
# GitHub disables scheduled workflows in repos with no activity for 60 days.
# It emails you first, and re-enabling is one click.

name: Keep Supabase awake

on:
  schedule:
    - cron: "0 9 * * 1" # 09:00 UTC every Monday
  workflow_dispatch: # lets you run it by hand from the Actions tab

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping the database
        env:
          API: "https://qikaqlooqrdgbjrgjeqs.supabase.co/rest/v1"
          KEY: "sb_publishable_6uhPEcefMqVcFdr2gZ31nQ_xubI4N-X"
        run: |
          curl --fail --show-error --silent \
            -X POST "$API/rpc/pt_ping" \
            -H "Content-Type: application/json" \
            -H "apikey: $KEY" \
            -H "Authorization: Bearer $KEY" \
            -d '{}'
